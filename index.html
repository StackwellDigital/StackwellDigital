<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#e8e3d8;
  --cream-dark:#d8d3c6;
  --ink:#1a1714;
  --ink-mid:#5a5550;
  --ink-light:#9a9590;
  --accent:#c8b84a;
  --orange:#F97316;
  --rule:rgba(26,23,20,0.14);
  --display:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
  --mono:'DM Mono',monospace;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-weight:300;
  -webkit-user-select:none;user-select:none;touch-action:none;}

/* ===== CANVAS ===== */
#viewport{position:fixed;inset:0;cursor:grab;overflow:hidden;background:var(--cream)}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;top:0;left:0;will-change:transform;transform-origin:0 0}
.tile{position:absolute;background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;transition:border-color .25s,box-shadow .25s;cursor:pointer;box-shadow:0 2px 12px rgba(26,23,20,0.07)}
.tile:hover{border-color:var(--accent);box-shadow:0 18px 56px rgba(26,23,20,0.16);z-index:5}
.tile.section-tile{border-color:rgba(26,23,20,0.2)}
.tile.section-tile:hover{border-color:var(--accent)}
.tile-label{position:absolute;left:0;bottom:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;background:linear-gradient(to top,rgba(232,227,216,0.96),rgba(232,227,216,0));pointer-events:none}
.tile-name{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.tile-tag{font-family:var(--mono);font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.section-tile .tile-tag{color:var(--orange)}
.tile-frame-wrap{position:absolute;inset:0;overflow:hidden;background:var(--cream)}
.tile-frame-wrap iframe{position:absolute;top:0;left:0;border:0;pointer-events:none;transform-origin:0 0;background:var(--cream)}
.tile-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.tile-placeholder span{font-family:var(--display);font-weight:900;font-size:2.2rem;letter-spacing:.02em;color:rgba(26,23,20,0.12);text-transform:uppercase;text-align:center;padding:0 1rem}

/* ===== FIXED UI ===== */
.ui-logo{position:fixed;top:1.1rem;left:1.5rem;z-index:300;cursor:pointer;background:#0a0a0a;border-radius:10px;padding:.4rem .7rem;display:flex;align-items:center;transition:box-shadow .2s}
.ui-logo:hover{box-shadow:0 6px 24px rgba(26,23,20,0.25)}
.ui-logo img{height:42px;width:auto;display:block}

/* weRender-style pill nav */
nav{position:fixed;top:1.25rem;right:1.5rem;z-index:300;display:flex;align-items:center}
.nav-pill{background:var(--cream);border-radius:50px;padding:.5rem .5rem .5rem 1.3rem;display:flex;align-items:center;gap:.25rem;box-shadow:0 2px 12px rgba(26,23,20,0.12)}
.nav-links{display:flex;align-items:center;gap:0;flex-wrap:nowrap}
.nav-links button{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mid);background:none;border:0;padding:.4rem .85rem;cursor:pointer;transition:color .2s;white-space:nowrap}
.nav-links button:hover{color:var(--ink)}
.nav-contact{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--ink);border:0;border-radius:50px;padding:.6rem 1.2rem;cursor:pointer;white-space:nowrap;margin-left:.3rem}
.nav-contact:hover{background:#000}
.nav-hbg{display:none}

.ui-hint{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);z-index:100;font-family:var(--mono);font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-light);background:rgba(232,227,216,0.9);backdrop-filter:blur(8px);border:1px solid var(--rule);border-radius:40px;padding:.5rem 1.1rem;pointer-events:none;transition:opacity .6s;opacity:0}
.ui-hint.show{opacity:1}
.ui-hint.hide{opacity:0}

/* ===== FULLSCREEN VIEW ===== */
#full{position:fixed;inset:0;z-index:200;background:var(--cream);display:none;opacity:0;transition:opacity .35s}
#full.open{display:block}
#full.show{opacity:1}
#full iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--cream)}
.full-bar{position:fixed;top:1.25rem;right:1.5rem;z-index:310;display:none;gap:.5rem}
.full-bar.show{display:flex}
.full-bar a,.full-bar button{font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;border-radius:40px;padding:.6rem 1.15rem;cursor:pointer;text-decoration:none;border:1px solid var(--rule);background:rgba(232,227,216,0.92);backdrop-filter:blur(8px);color:var(--ink-mid);transition:color .2s,border-color .2s;box-shadow:0 2px 12px rgba(26,23,20,0.1)}
.full-bar a:hover,.full-bar button:hover{color:var(--ink);border-color:var(--ink-mid)}
.full-bar a.visit{background:var(--orange);border-color:var(--orange);color:#fff}

@media (max-width:768px){
  nav{top:auto;bottom:1rem;right:50%;transform:translateX(50%);max-width:calc(100vw - 1.5rem)}
  .nav-pill{overflow-x:auto;padding-left:.8rem}
  .ui-hint{bottom:4.8rem}
  .ui-logo img{height:34px}
  .full-bar{top:auto;bottom:1rem;right:50%;transform:translateX(50%)}
}
</style>
</head>
<body>

<div class="ui-logo" id="logo" title="Back to the grid">
  <img src="https://raw.githubusercontent.com/StackwellDigital/StackwellDigital/main/logo.photo.png" alt="Stackwell Digital"/>
</div>

<nav id="grid-nav" aria-label="Main">
  <div class="nav-pill">
    <div class="nav-links" id="navLinks"></div>
    <button class="nav-contact" data-goto="contact">Contact</button>
  </div>
</nav>

<div class="ui-hint" id="hint">Drag to explore · Click any window to open it</div>

<div id="viewport"><div id="world"></div></div>

<div id="full"></div>
<div class="full-bar" id="full-bar">
  <a class="visit" id="full-visit" href="#" target="_blank" rel="noopener" style="display:none">Visit Live ↗</a>
  <button id="full-close">✕ Back to Grid</button>
</div>

<script>
/* =========================================================
   CONFIG
   SECTION tiles = pages split out of the main site.
   They are 4x the area of a normal tile (2 cols x 2 rows)
   and the top nav pans to them.
   SITE tiles = standalone index files of other builds.
========================================================= */

/* base grid unit */
const U_W = 440;            /* normal tile width  */
const U_H = 300;            /* normal tile height */
const GAP = Math.round(U_W / 8);  /* gap = 1/8 of a tile width */
const CELL_W = U_W + GAP;
const CELL_H = U_H + GAP;

/* section tiles: render the main site at its true width, scaled to fit a big tile */
const SECTION_NATIVE_W = 1440;   /* viewport width the main-site sections design for */
/* site tiles: same idea, their own design width */
const SITE_NATIVE_W = 1440;

/* SECTION TILES — order here = nav order. span = how many grid cells wide/tall. */
const SECTIONS = [
  {id:'hero',     name:'Stackwell Digital', tag:'Start Here', src:'/main/hero/index.html'},
  {id:'services', name:'Services',          tag:'What We Do', src:'/main/services/index.html'},
  {id:'process',  name:'Process',           tag:'How It Works', src:'/main/process/index.html'},
  {id:'audit',    name:'Free Website Audit',tag:'Free Tool',  src:'/main/audit/index.html'},
  {id:'pricing',  name:'Pricing',           tag:'Plans',      src:'/main/pricing/index.html'},
  {id:'work',     name:'Our Work',          tag:'Portfolio',  src:'/main/work/index.html'},
  {id:'reports',  name:'Reports',           tag:'Analytics',  src:'/main/reports/index.html'},
  {id:'team',     name:'About',             tag:'Who We Are', src:'/main/team/index.html'},
  {id:'faq',      name:'FAQ',               tag:'Questions',  src:'/main/faq/index.html'},
  {id:'contact',  name:'Contact',           tag:'Get Started',src:'/main/contact/index.html'},
];

/* SITE TILES — the other standalone builds that fill the rest of the sandbox */
const SITES = [
  {id:'baselines',   name:'Baselines Pub',       tag:'Client',  src:'/sites/baselines/index.html'},
  {id:'littlegreens',name:'Little Greens Farm',  tag:'Demo',    src:'/sites/littlegreens/index.html'},
  {id:'atwood',      name:'Atwood Furniture Co.',tag:'Demo',    src:'/sites/atwood/index.html'},
  {id:'chipd',       name:'Chipd Golf',          tag:'Live', live:'https://chipdgolf.ca',    src:'/sites/chipd/index.html'},
  {id:'pitchd',      name:'Pitchd',              tag:'Live', live:'https://pitchd.ca',       src:'/sites/pitchd/index.html'},
  {id:'vomad',       name:'Vomad Rentals',       tag:'Live', live:'https://vomadrentals.ca', src:'/sites/vomad/index.html'},
  {id:'borrowhood',  name:'Borrowhood',          tag:'Demo',    src:'/sites/borrowhood/index.html'},
  {id:'stackwellv1', name:'Stackwell · V1',      tag:'Concept', src:'/concepts/stackwell-v1/index.html'},
  {id:'stackwellv2', name:'Stackwell · V2',      tag:'Concept', src:'/concepts/stackwell-v2/index.html'},
  {id:'stackwellv3', name:'Stackwell · V3',      tag:'Concept', src:'/concepts/stackwell-v3/index.html'},
];

/* =========================================================
   LAYOUT — vertical SECTION SPINE + dense SITE fill.
   - Section tiles (2x2 = 4x a normal tile) stack DOWNWARD in
     one column, in reading order (hero at top -> contact).
   - Every other cell in the repeating block is packed with a
     site tile, so the infinite plane has NO blank space.
   - Sites cycle/repeat to fill (godly-style wallpaper); a row
     offset keeps the same tile from stacking on itself.
   Tune BLOCK_COLS / SPINE_COL to taste.
========================================================= */
const SPAN = 2;                 /* section tile = 2x2 cells */
const BLOCK_COLS = 6;           /* total grid columns in one repeating block */
const SPINE_COL = 2;            /* column index where the section spine starts */
const BLOCK_ROWS = SECTIONS.length * SPAN;  /* spine defines block height */

const byId = {};
SECTIONS.forEach(s => byId[s.id] = {...s, _section:true});
SITES.forEach(s => byId[s.id] = {...s, _section:false});

/* occupancy grid */
const occ = Array.from({length: BLOCK_ROWS}, () => new Array(BLOCK_COLS).fill(false));
const PLACEMENT = [];

/* 1) place the section spine, top to bottom */
SECTIONS.forEach((s, i) => {
  const row = i * SPAN, col = SPINE_COL;
  for (let r = row; r < row + SPAN; r++)
    for (let c = col; c < col + SPAN; c++) occ[r][c] = true;
  PLACEMENT.push({ref: s.id, col, row, cw: SPAN, ch: SPAN, kind: 'section'});
});

/* 2) deterministic shuffle of site order so the wallpaper isn't an obvious loop */
function shuffled(arr, seed) {
  const a = arr.slice(); let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const fillOrder = shuffled(SITES.map(s => s.id), 7);

/* 3) pack every remaining cell with a site tile */
let k = 0;
for (let r = 0; r < BLOCK_ROWS; r++) {
  for (let c = 0; c < BLOCK_COLS; c++) {
    if (occ[r][c]) continue;
    const id = fillOrder[(k + r * 2) % fillOrder.length];  /* row offset breaks vertical repeats */
    PLACEMENT.push({ref: id, col: c, row: r, cw: 1, ch: 1, kind: 'site'});
    k++;
  }
}

const BLOCK_W = BLOCK_COLS * CELL_W;   /* seamless wrap: no padding cells */
const BLOCK_H = BLOCK_ROWS * CELL_H;

/* build the master TILES list with px geometry.
   site ids can repeat, so give every tile a unique uid. */
let _uid = 0;
const TILES = PLACEMENT.map(p => {
  const meta = byId[p.ref];
  return {
    ...meta,
    uid: 't' + (_uid++),
    section: p.kind === 'section',
    x: p.col * CELL_W,
    y: p.row * CELL_H,
    w: p.cw * CELL_W - GAP,
    h: p.ch * CELL_H - GAP,
  };
});

const MAX_IFRAMES = 8;

/* pan feel · lower = slower */
const DRAG_SPEED = 0.55;
const WHEEL_SPEED = 0.35;
const SMOOTHING = 0.12;
const FRICTION = 0.90;

/* ===================== ENGINE ===================== */
const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
let tx = 0, ty = 0, ox = 0, oy = 0;
let zoom = 1, tzoom = 1;
let dragging = false, moved = 0, lastX = 0, lastY = 0, vx = 0, vy = 0;
let introDone = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cells = [];
for (let by = -1; by <= 1; by++) {
  for (let bx = -1; bx <= 1; bx++) {
    TILES.forEach(t => {
      const el = document.createElement('div');
      el.className = 'tile' + (t.section ? ' section-tile' : '');
      el.style.width = t.w + 'px';
      el.style.height = t.h + 'px';
      el.dataset.id = t.id;
      el.innerHTML = `<div class="tile-frame-wrap"><div class="tile-placeholder"><span>${t.name}</span></div></div>
        <div class="tile-label"><span class="tile-name">${t.name}</span><span class="tile-tag">${t.tag||''}</span></div>`;
      el.addEventListener('click', () => { if (moved < 6 && introDone) openTile(t.id); });
      world.appendChild(el);
      cells.push({el, tile: t, bx, by, framed: false});
    });
  }
}

function layout() {
  const mx = ((ox % BLOCK_W) + BLOCK_W) % BLOCK_W;
  const my = ((oy % BLOCK_H) + BLOCK_H) % BLOCK_H;
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (const c of cells) {
    const x = c.tile.x + c.bx * BLOCK_W + mx - BLOCK_W;
    const y = c.tile.y + c.by * BLOCK_H + my - BLOCK_H;
    c.el.style.transform = `translate3d(${x}px,${y}px,0)`;
    c.sx = (x - cx) * zoom + cx;
    c.sy = (y - cy) * zoom + cy;
  }
  world.style.transform = `translate3d(${(1 - zoom) * innerWidth / 2}px,${(1 - zoom) * innerHeight / 2}px,0) scale(${zoom})`;
  manageIframes();
}

let frameCount = 0;
function manageIframes() {
  const vw = innerWidth, vh = innerHeight, pad = 260;
  for (const c of cells) {
    const w = c.tile.w * zoom, h = c.tile.h * zoom;
    const visible = c.sx + w > -pad && c.sx < vw + pad && c.sy + h > -pad && c.sy < vh + pad;
    if (visible && !c.framed && frameCount < MAX_IFRAMES) {
      const wrap = c.el.querySelector('.tile-frame-wrap');
      const f = document.createElement('iframe');
      f.loading = 'lazy';
      f.src = c.tile.src;
      f.setAttribute('tabindex','-1');
      const nativeW = c.tile.section ? SECTION_NATIVE_W : SITE_NATIVE_W;
      const scale = c.tile.w / nativeW;
      f.style.width = nativeW + 'px';
      f.style.height = Math.ceil(c.tile.h / scale) + 'px';
      f.style.transform = `scale(${scale})`;
      wrap.appendChild(f);
      c.framed = true; frameCount++;
    } else if (!visible && c.framed) {
      const f = c.el.querySelector('iframe');
      if (f) f.remove();
      c.framed = false; frameCount--;
    }
  }
}

function releaseIntro() {
  if (introDone) return;
  introDone = true;
  if (reduceMotion) { zoom = tzoom = 1; layout(); }
  else tzoom = 1;
  showHint();
}

viewport.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; vx = vy = 0;
  lastX = e.clientX; lastY = e.clientY;
  viewport.classList.add('dragging');
  viewport.setPointerCapture(e.pointerId);
  releaseIntro();
});
viewport.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = (e.clientX - lastX) * DRAG_SPEED;
  const dy = (e.clientY - lastY) * DRAG_SPEED;
  moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
  tx += dx; ty += dy; vx = dx; vy = dy;
  lastX = e.clientX; lastY = e.clientY;
  hideHint();
});
viewport.addEventListener('pointerup', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('pointercancel', () => { dragging = false; viewport.classList.remove('dragging'); });
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  releaseIntro();
  tx -= e.deltaX * WHEEL_SPEED; ty -= e.deltaY * WHEEL_SPEED;
  hideHint();
}, {passive: false});

function tick() {
  if (!dragging && (Math.abs(vx) > 0.05 || Math.abs(vy) > 0.05)) {
    tx += vx; ty += vy; vx *= FRICTION; vy *= FRICTION;
  }
  const ease = reduceMotion ? 1 : SMOOTHING;
  ox += (tx - ox) * ease; oy += (ty - oy) * ease;
  if (Math.abs(tx - ox) > 0.05 || Math.abs(ty - oy) > 0.05 || Math.abs(tzoom - zoom) > 0.0005 || dragging) {
    zoom += (tzoom - zoom) * (reduceMotion ? 1 : 0.08);
    layout();
  }
  requestAnimationFrame(tick);
}

/* ===================== INTRO ===================== */
function centerOn(id, set) {
  const t = TILES.find(t => t.id === id);
  if (!t) return null;
  const nx = (innerWidth - t.w) / 2 - t.x;
  const ny = (innerHeight - t.h) / 2 - t.y;
  if (set) { tx = nx; ty = ny; ox = nx; oy = ny; }
  return {t, nx, ny};
}
function initView() {
  const {t} = centerOn('hero', true);
  const z = Math.min(innerWidth / t.w, innerHeight / t.h) * 1.02;
  zoom = tzoom = z;
  layout();
  if (reduceMotion) releaseIntro();
}

let hintHidden = false;
function showHint(){ if(!hintHidden) document.getElementById('hint').classList.add('show'); setTimeout(hideHint, 7000); }
function hideHint(){ if(!hintHidden){ const h = document.getElementById('hint'); h.classList.remove('show'); h.classList.add('hide'); hintHidden = true; } }

/* ===================== NAV: build links + pan-to ===================== */
const navLinks = document.getElementById('navLinks');
SECTIONS.forEach(s => {
  if (s.id === 'contact') return; /* contact is the pill button */
  const b = document.createElement('button');
  b.textContent = s.id === 'hero' ? 'Home' : s.name;
  b.dataset.goto = s.id;
  navLinks.appendChild(b);
});
document.querySelectorAll('[data-goto]').forEach(b => {
  b.addEventListener('click', () => { closeFull(); panTo(b.dataset.goto); });
});
function panTo(id) {
  releaseIntro();
  const res = centerOn(id, false);
  if (!res) return;
  let dx = res.nx - tx, dy = res.ny - ty;
  /* choose nearest wrapped copy so we never pan the long way */
  dx = ((dx % BLOCK_W) + BLOCK_W * 1.5) % BLOCK_W - BLOCK_W / 2;
  dy = ((dy % BLOCK_H) + BLOCK_H * 1.5) % BLOCK_H - BLOCK_H / 2;
  vx = vy = 0;
  tx += dx; ty += dy;   /* tick() eases the glide */
}

/* ===================== FULLSCREEN ===================== */
const full = document.getElementById('full');
const fullBar = document.getElementById('full-bar');
const fullVisit = document.getElementById('full-visit');
const gridNav = document.getElementById('grid-nav');
let fullOpen = false;

function openTile(id) {
  const t = TILES.find(t => t.id === id);
  if (!t) return;
  full.innerHTML = '';
  if (t.live) { fullVisit.href = t.live; fullVisit.style.display = ''; }
  else fullVisit.style.display = 'none';
  const f = document.createElement('iframe');
  f.src = t.src;
  full.appendChild(f);
  full.classList.add('open');
  requestAnimationFrame(() => full.classList.add('show'));
  fullBar.classList.add('show');
  gridNav.style.display = 'none';
  hideHint();
  fullOpen = true;
  if (window.fbq) fbq('trackCustom', 'TileOpen', {tile: id});
  gtag('event', 'tile_open', {tile_id: id});
}
function closeFull() {
  if (!fullOpen) return;
  full.classList.remove('show');
  setTimeout(() => { full.classList.remove('open'); full.innerHTML = ''; }, 350);
  fullBar.classList.remove('show');
  gridNav.style.display = '';
  fullOpen = false;
}
document.getElementById('logo').addEventListener('click', () => { if (fullOpen) closeFull(); });
document.getElementById('full-close').addEventListener('click', closeFull);
addEventListener('keydown', e => { if (e.key === 'Escape') closeFull(); });
addEventListener('resize', () => { if (!introDone) initView(); else layout(); });

/* go */
initView();
requestAnimationFrame(tick);
</script>
</body>
</html>
