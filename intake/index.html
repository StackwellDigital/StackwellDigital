<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Intake - Stackwell Digital</title>
  <meta name="description" content="Share your brand details with Stackwell Digital so we can build you the perfect website." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;500&family=Lora:ital,wght@0,400;1,400&family=Bebas+Neue&family=Raleway:wght@300;400;600&family=Oswald:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Space+Grotesk:wght@300;500;700&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      padding: 0;
      border: none;
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // ─── CONFIG ──────────────────────────────────────────────────
    // Update this once your worker is deployed
    const WORKER_URL = 'https://intake-form.adam-8d6.workers.dev';

    // ─── PALETTE ─────────────────────────────────────────────────
    const PALETTE = [
      { hex: '#FFFFFF', label: 'White' },
      { hex: '#F5F0E8', label: 'Cream' },
      { hex: '#E8E0D0', label: 'Linen' },
      { hex: '#C8C5BF', label: 'Silver' },
      { hex: '#888580', label: 'Stone' },
      { hex: '#3D3A36', label: 'Charcoal' },
      { hex: '#0B0B0B', label: 'Black' },
      { hex: '#C4724A', label: 'Terracotta' },
      { hex: '#4A8C6F', label: 'Sage' },
      { hex: '#2E5F8A', label: 'Navy' },
      { hex: '#7B4FA6', label: 'Plum' },
      { hex: '#C5973A', label: 'Gold' },
      { hex: '#B83232', label: 'Crimson' },
      { hex: '#3A7D8C', label: 'Teal' },
    ];

    // ─── FONT PAIRS ──────────────────────────────────────────────
    const FONT_PAIRS = [
      { id: 'playfair-inter',       display: 'Playfair Display',    body: 'Inter',       label: 'Classic & Editorial',  displaySample: 'Elegant',        bodySample: 'Clean, timeless, professional',   displayWeight: '700', displayStyle: 'normal' },
      { id: 'bebas-dmSans',         display: 'Bebas Neue',          body: 'DM Sans',     label: 'Bold & Modern',        displaySample: 'IMPACT',         bodySample: 'Strong, direct, contemporary',    displayWeight: '400', displayStyle: 'normal' },
      { id: 'cormorant-raleway',    display: 'Cormorant Garamond',  body: 'Raleway',     label: 'Luxury & Refined',     displaySample: 'Sophisticated',  bodySample: 'Graceful, high-end, editorial',   displayWeight: '300', displayStyle: 'italic' },
      { id: 'oswald-lora',          display: 'Oswald',              body: 'Lora',        label: 'Strong & Trustworthy', displaySample: 'RELIABLE',       bodySample: 'Grounded, confident, warm',       displayWeight: '600', displayStyle: 'normal' },
      { id: 'spaceGrotesk-inter',   display: 'Space Grotesk',       body: 'Inter',       label: 'Tech & Startup',       displaySample: 'Forward',        bodySample: 'Precise, digital, sharp',         displayWeight: '700', displayStyle: 'normal' },
      { id: 'fraunces-montserrat',  display: 'Fraunces',            body: 'Montserrat',  label: 'Warm & Artisan',       displaySample: 'Crafted',        bodySample: 'Handmade feel, creative, inviting', displayWeight: '400', displayStyle: 'italic' },
    ];

    // ─── AESTHETIC THEMES ────────────────────────────────────────
    const THEMES = [
      { id: 'warm-airy',      name: 'Warm & Airy',        desc: 'Soft creams, natural light, organic textures',        mock: { bg: '#FAF6EF', surface: '#F0E8D8', accent: '#C4724A', text: '#3D2B1F', bars: ['#E8D8C0','#D4C4A8'] } },
      { id: 'dark-modern',    name: 'Dark & Modern',      desc: 'Deep blacks, sharp contrast, bold typography',        mock: { bg: '#0A0A0A', surface: '#161616', accent: '#FFFFFF', text: '#FFFFFF', bars: ['#222222','#333333'] } },
      { id: 'clean-minimal',  name: 'Clean & Minimal',    desc: 'Pure white, lots of space, understated elegance',     mock: { bg: '#FFFFFF', surface: '#F5F5F5', accent: '#111111', text: '#111111', bars: ['#E8E8E8','#D0D0D0'] } },
      { id: 'bold-vibrant',   name: 'Bold & Vibrant',     desc: 'Strong colours, high energy, makes a statement',      mock: { bg: '#1A0A2E', surface: '#2D1557', accent: '#FF4D6D', text: '#FFFFFF', bars: ['#7B2FBE','#FF4D6D'] } },
      { id: 'earthy-organic', name: 'Earthy & Organic',   desc: 'Muted greens, browns, grounded natural feel',         mock: { bg: '#2C2A1E', surface: '#3D3A28', accent: '#8BA888', text: '#E8E0C8', bars: ['#5C5840','#8BA888'] } },
      { id: 'soft-elegant',   name: 'Soft & Elegant',     desc: 'Blush tones, gentle contrast, refined warmth',        mock: { bg: '#FDF5F0', surface: '#F5E6DC', accent: '#C4728A', text: '#3D2830', bars: ['#E8C8D0','#D4A0B0'] } },
      { id: 'coastal-fresh',  name: 'Coastal & Fresh',    desc: 'Blues, whites, open and breezy feeling',              mock: { bg: '#EEF4FA', surface: '#D8EAF5', accent: '#1A5F8A', text: '#0D2D42', bars: ['#A8CDE0','#1A5F8A'] } },
      { id: 'industrial',     name: 'Industrial & Raw',   desc: 'Concrete tones, metal accents, no-nonsense',          mock: { bg: '#1C1C1C', surface: '#2A2A2A', accent: '#E8A020', text: '#CCCCCC', bars: ['#404040','#E8A020'] } },
    ];

    // ─── MINI MOCK ───────────────────────────────────────────────
    const ThemeMock = ({ theme }) => (
      <div style={{ width: '100%', height: '90px', background: theme.mock.bg, borderRadius: '3px', overflow: 'hidden', position: 'relative', marginBottom: '0.75rem', border: '1px solid rgba(255,255,255,0.06)' }}>
        <div style={{ height: '12px', background: theme.mock.surface, borderBottom: `1px solid ${theme.mock.bars[0]}20`, display: 'flex', alignItems: 'center', paddingLeft: '6px', gap: '3px' }}>
          <div style={{ width: '20px', height: '4px', background: theme.mock.accent, borderRadius: '1px', opacity: 0.9 }} />
          <div style={{ width: '14px', height: '3px', background: theme.mock.text, borderRadius: '1px', opacity: 0.2, marginLeft: '6px' }} />
          <div style={{ width: '14px', height: '3px', background: theme.mock.text, borderRadius: '1px', opacity: 0.2 }} />
          <div style={{ flex: 1 }} />
          <div style={{ width: '18px', height: '5px', background: theme.mock.accent, borderRadius: '1px', marginRight: '6px', opacity: 0.9 }} />
        </div>
        <div style={{ padding: '8px 10px 0' }}>
          <div style={{ width: '55%', height: '7px', background: theme.mock.text, borderRadius: '1px', opacity: 0.85, marginBottom: '4px' }} />
          <div style={{ width: '40%', height: '5px', background: theme.mock.text, borderRadius: '1px', opacity: 0.3, marginBottom: '8px' }} />
          <div style={{ width: '28px', height: '8px', background: theme.mock.accent, borderRadius: '1px' }} />
        </div>
        <div style={{ display: 'flex', gap: '4px', padding: '8px 10px 0' }}>
          {[theme.mock.bars[0], theme.mock.bars[1], theme.mock.surface].map((c, i) => (
            <div key={i} style={{ flex: 1, height: '22px', background: c, borderRadius: '2px', opacity: 0.85 }} />
          ))}
        </div>
      </div>
    );

    // ─── COLOUR PICKER ───────────────────────────────────────────
    const ColourPicker = ({ label, value, onChange }) => {
      const inputRef = useRef(null);
      const isCustom = !PALETTE.find(p => p.hex.toLowerCase() === value.toLowerCase());
      return (
        <div>
          <div style={{ fontFamily: 'DM Mono', fontSize: '0.68rem', letterSpacing: '0.15em', textTransform: 'uppercase', color: '#666', marginBottom: '0.9rem' }}>{label}</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '7px', marginBottom: '0.9rem' }}>
            {PALETTE.map(({ hex, label: name }) => {
              const active = hex.toLowerCase() === value.toLowerCase();
              return (
                <button key={hex} title={name} onClick={() => onChange(hex)} style={{ width: '36px', height: '36px', background: hex, border: active ? '3px solid #fff' : hex === '#FFFFFF' ? '1px solid rgba(255,255,255,0.2)' : '3px solid transparent', borderRadius: '4px', cursor: 'pointer', outline: 'none', boxShadow: active ? '0 0 0 1px rgba(255,255,255,0.5)' : 'none', transition: 'transform 0.1s' }}
                  onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.12)'}
                  onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
                />
              );
            })}
            {/* Custom tile */}
            <button title="Custom colour" onClick={() => inputRef.current.click()} style={{ width: '36px', height: '36px', background: isCustom ? value : 'conic-gradient(from 0deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000)', border: isCustom ? '3px solid #fff' : '3px solid rgba(255,255,255,0.15)', borderRadius: '4px', cursor: 'pointer', outline: 'none', position: 'relative', overflow: 'hidden', boxShadow: isCustom ? '0 0 0 1px rgba(255,255,255,0.5)' : 'none', transition: 'transform 0.1s' }}
              onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.12)'}
              onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
            >
              {!isCustom && <span style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', color: '#fff', textShadow: '0 1px 3px rgba(0,0,0,0.8)' }}>+</span>}
            </button>
            <input ref={inputRef} type="color" value={value} onChange={e => onChange(e.target.value)} style={{ position: 'absolute', opacity: 0, pointerEvents: 'none', width: 0, height: 0 }} />
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
            <div style={{ width: '32px', height: '32px', background: value, border: '1px solid rgba(255,255,255,0.15)', borderRadius: '3px', flexShrink: 0 }} />
            <input type="text" value={value} onChange={e => onChange(e.target.value)} style={{ background: '#111', border: '1px solid rgba(255,255,255,0.1)', color: '#aaa', padding: '0.5rem 0.75rem', fontFamily: 'DM Mono', fontSize: '0.78rem', width: '110px', outline: 'none' }} />
            {!isCustom && <span style={{ fontFamily: 'DM Mono', fontSize: '0.68rem', color: '#555' }}>{PALETTE.find(p => p.hex.toLowerCase() === value.toLowerCase())?.label}</span>}
          </div>
        </div>
      );
    };

    // ─── SHARED STYLES ───────────────────────────────────────────
    const labelStyle = { display: 'block', fontSize: '0.7rem', color: '#666', marginBottom: '0.6rem', fontFamily: 'DM Mono', letterSpacing: '0.12em', textTransform: 'uppercase' };
    const inputStyle = { width: '100%', background: '#111', border: '1px solid rgba(255,255,255,0.1)', color: '#fff', padding: '0.9rem 1.1rem', fontSize: '0.95rem', fontFamily: 'DM Sans', outline: 'none' };
    const btnPrimaryStyle = { background: '#fff', border: 'none', color: '#0a0a0a', padding: '0.9rem 2.2rem', fontFamily: 'DM Mono', fontSize: '0.72rem', letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer' };
    const btnGhostStyle = { background: 'transparent', border: '1px solid rgba(255,255,255,0.2)', color: '#fff', padding: '0.9rem 2.2rem', fontFamily: 'DM Mono', fontSize: '0.72rem', letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer' };

    // ─── MAIN FORM ───────────────────────────────────────────────
    function BrandIntakeForm() {
      const [step, setStep] = useState(1);
      const [submitting, setSubmitting] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [submitError, setSubmitError] = useState('');

      const [formData, setFormData] = useState({
        brandName: '',
        tagline: '',
        logoPreview: null,
        primaryColour:   '#2E5F8A',
        secondaryColour: '#C4724A',
        lightColour:     '#F5F0E8',
        darkColour:      '#0B0B0B',
        fontPair: 'playfair-inter',
        theme: 'warm-airy',
      });

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setFormData(prev => ({ ...prev, logoPreview: reader.result }));
          reader.readAsDataURL(file);
        }
      };

      const selectedFont  = FONT_PAIRS.find(f => f.id === formData.fontPair) || FONT_PAIRS[0];
      const selectedTheme = THEMES.find(t => t.id === formData.theme) || THEMES[0];

      const handleSubmit = async () => {
        setSubmitting(true);
        setSubmitError('');
        try {
          const payload = {
            brandName:       formData.brandName,
            tagline:         formData.tagline,
            primaryColour:   formData.primaryColour,
            secondaryColour: formData.secondaryColour,
            lightColour:     formData.lightColour,
            darkColour:      formData.darkColour,
            fontPair:        `${selectedFont.display} (headings) · ${selectedFont.body} (body)`,
            fontLabel:       selectedFont.label,
            theme:           selectedTheme.name,
            themeDesc:       selectedTheme.desc,
          };
          const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (!res.ok) throw new Error('Submit failed');
          setSubmitted(true);
        } catch (err) {
          setSubmitError('Something went wrong. Please try again or email adam@stackwell.digital directly.');
        } finally {
          setSubmitting(false);
        }
      };

      // ── THANK YOU SCREEN ──
      if (submitted) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '2rem', textAlign: 'center' }}>
            <a href="https://stackwell.digital" style={{ display: 'inline-block', marginBottom: '3rem' }}>
              <img src="https://raw.githubusercontent.com/StackwellDigital/StackwellDigital/main/logo.photo.png" alt="Stackwell Digital" style={{ height: '52px' }} />
            </a>
            <div style={{ fontSize: '2.5rem', marginBottom: '1.5rem' }}>✓</div>
            <h1 style={{ fontFamily: 'Bebas Neue', fontSize: '3rem', letterSpacing: '0.02em', marginBottom: '1rem' }}>
              You're all set.
            </h1>
            <p style={{ color: '#666', fontSize: '1.05rem', lineHeight: 1.8, maxWidth: '420px' }}>
              Thanks for filling out the intake form. We'll be in touch shortly with next steps.
            </p>
          </div>
        );
      }

      // ── STEP 1: Brand Basics ──
      const renderStep1 = () => (
        <div style={{ maxWidth: '560px' }}>
          <h2 style={{ fontFamily: 'Bebas Neue', fontSize: '3rem', marginBottom: '0.5rem', letterSpacing: '0.02em' }}>Brand Basics</h2>
          <p style={{ color: '#666', marginBottom: '3rem', lineHeight: '1.7', fontSize: '0.95rem' }}>Let's start with the fundamentals.</p>

          <div style={{ marginBottom: '1.5rem' }}>
            <label style={labelStyle}>Brand Name</label>
            <input type="text" value={formData.brandName} onChange={e => setFormData(prev => ({ ...prev, brandName: e.target.value }))} placeholder="Your Business Name" style={inputStyle} />
          </div>

          <div style={{ marginBottom: '2rem' }}>
            <label style={labelStyle}>Tagline <span style={{ color: '#444' }}>(optional)</span></label>
            <input type="text" value={formData.tagline} onChange={e => setFormData(prev => ({ ...prev, tagline: e.target.value }))} placeholder="A brief description of what you do" style={inputStyle} />
          </div>

          <div>
            <label style={labelStyle}>Logo <span style={{ color: '#444' }}>(if you have one)</span></label>
            <div onClick={() => document.getElementById('logoUpload').click()} style={{ border: '2px dashed rgba(255,255,255,0.15)', padding: '2rem', textAlign: 'center', cursor: 'pointer', background: formData.logoPreview ? '#111' : 'transparent', transition: 'border-color 0.2s' }}
              onMouseEnter={e => e.currentTarget.style.borderColor = 'rgba(255,255,255,0.3)'}
              onMouseLeave={e => e.currentTarget.style.borderColor = 'rgba(255,255,255,0.15)'}
            >
              <input id="logoUpload" type="file" accept="image/*" onChange={handleLogoUpload} style={{ display: 'none' }} />
              {formData.logoPreview ? (
                <img src={formData.logoPreview} alt="Logo" style={{ maxWidth: '200px', maxHeight: '120px', display: 'block', margin: '0 auto' }} />
              ) : (
                <>
                  <div style={{ fontSize: '1.5rem', marginBottom: '0.5rem', opacity: 0.4 }}>↑</div>
                  <p style={{ color: '#555', fontSize: '0.85rem' }}>Click to upload</p>
                  <p style={{ color: '#444', fontSize: '0.75rem', marginTop: '0.25rem' }}>PNG, JPG, or SVG</p>
                </>
              )}
            </div>
          </div>
        </div>
      );

      // ── STEP 2: Colours ──
      const renderStep2 = () => (
        <div style={{ maxWidth: '600px' }}>
          <h2 style={{ fontFamily: 'Bebas Neue', fontSize: '3rem', marginBottom: '0.5rem', letterSpacing: '0.02em' }}>Brand Colours</h2>
          <p style={{ color: '#666', marginBottom: '2.5rem', lineHeight: '1.7', fontSize: '0.95rem' }}>
            Pick four colours for your brand. Don't overthink it.
          </p>

          {/* Live 4-colour preview */}
          <div style={{ display: 'flex', height: '52px', marginBottom: '0.5rem', border: '1px solid rgba(255,255,255,0.08)', borderRadius: '3px', overflow: 'hidden' }}>
            {[
              { color: formData.primaryColour,   label: 'Main' },
              { color: formData.secondaryColour, label: 'Secondary' },
              { color: formData.lightColour,     label: 'Light' },
              { color: formData.darkColour,      label: 'Dark' },
            ].map(({ color }) => (
              <div key={color} style={{ flex: 1, background: color }} />
            ))}
          </div>
          <div style={{ display: 'flex', marginBottom: '2.5rem' }}>
            {['Main', 'Secondary', 'Light', 'Dark'].map(l => (
              <div key={l} style={{ flex: 1, fontFamily: 'DM Mono', fontSize: '0.55rem', letterSpacing: '0.12em', textTransform: 'uppercase', color: '#444', textAlign: 'center' }}>{l}</div>
            ))}
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: '2.5rem' }}>
            <ColourPicker label="Main Brand Colour"  value={formData.primaryColour}   onChange={v => setFormData(prev => ({ ...prev, primaryColour: v }))} />
            <div style={{ borderTop: '1px solid rgba(255,255,255,0.06)' }} />
            <ColourPicker label="Secondary Colour"   value={formData.secondaryColour} onChange={v => setFormData(prev => ({ ...prev, secondaryColour: v }))} />
            <div style={{ borderTop: '1px solid rgba(255,255,255,0.06)' }} />
            <ColourPicker label="Light / Background" value={formData.lightColour}     onChange={v => setFormData(prev => ({ ...prev, lightColour: v }))} />
            <div style={{ borderTop: '1px solid rgba(255,255,255,0.06)' }} />
            <ColourPicker label="Dark / Text"        value={formData.darkColour}      onChange={v => setFormData(prev => ({ ...prev, darkColour: v }))} />
          </div>
        </div>
      );

      // ── STEP 3: Fonts ──
      const renderStep3 = () => (
        <div style={{ maxWidth: '680px' }}>
          <h2 style={{ fontFamily: 'Bebas Neue', fontSize: '3rem', marginBottom: '0.5rem', letterSpacing: '0.02em' }}>Typography</h2>
          <p style={{ color: '#666', marginBottom: '2.5rem', lineHeight: '1.7', fontSize: '0.95rem' }}>Pick a font style that matches your brand's personality.</p>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
            {FONT_PAIRS.map(pair => {
              const active = formData.fontPair === pair.id;
              return (
                <div key={pair.id} onClick={() => setFormData(prev => ({ ...prev, fontPair: pair.id }))}
                  style={{ border: active ? '2px solid #fff' : '1px solid rgba(255,255,255,0.1)', padding: '1.5rem', cursor: 'pointer', background: active ? 'rgba(255,255,255,0.05)' : '#0e0e0e', transition: 'all 0.2s', borderRadius: '2px' }}
                  onMouseEnter={e => { if (!active) e.currentTarget.style.borderColor = 'rgba(255,255,255,0.25)'; }}
                  onMouseLeave={e => { if (!active) e.currentTarget.style.borderColor = 'rgba(255,255,255,0.1)'; }}
                >
                  <div style={{ fontFamily: pair.display, fontSize: '2rem', fontWeight: pair.displayWeight, fontStyle: pair.displayStyle, lineHeight: 1.1, marginBottom: '0.6rem', color: active ? '#fff' : '#ccc', letterSpacing: (pair.display === 'Bebas Neue' || pair.display === 'Oswald') ? '0.05em' : '0' }}>
                    {pair.displaySample}
                  </div>
                  <div style={{ fontFamily: pair.body, fontSize: '0.78rem', color: '#666', lineHeight: 1.5, marginBottom: '1rem' }}>
                    {pair.bodySample}
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid rgba(255,255,255,0.07)', paddingTop: '0.75rem' }}>
                    <span style={{ fontFamily: 'DM Mono', fontSize: '0.58rem', letterSpacing: '0.15em', textTransform: 'uppercase', color: active ? '#aaa' : '#555' }}>{pair.label}</span>
                    {active && <span style={{ color: '#fff', fontSize: '0.7rem' }}>✓</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );

      // ── STEP 4: Aesthetic ──
      const renderStep4 = () => (
        <div style={{ maxWidth: '720px' }}>
          <h2 style={{ fontFamily: 'Bebas Neue', fontSize: '3rem', marginBottom: '0.5rem', letterSpacing: '0.02em' }}>Aesthetic</h2>
          <p style={{ color: '#666', marginBottom: '2.5rem', lineHeight: '1.7', fontSize: '0.95rem' }}>What vibe should your website have?</p>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
            {THEMES.map(theme => {
              const active = formData.theme === theme.id;
              return (
                <div key={theme.id} onClick={() => setFormData(prev => ({ ...prev, theme: theme.id }))}
                  style={{ border: active ? '2px solid #fff' : '1px solid rgba(255,255,255,0.1)', padding: '1.25rem', cursor: 'pointer', background: active ? 'rgba(255,255,255,0.04)' : '#0e0e0e', transition: 'all 0.2s', borderRadius: '2px' }}
                  onMouseEnter={e => { if (!active) e.currentTarget.style.borderColor = 'rgba(255,255,255,0.25)'; }}
                  onMouseLeave={e => { if (!active) e.currentTarget.style.borderColor = 'rgba(255,255,255,0.1)'; }}
                >
                  <ThemeMock theme={theme} />
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div>
                      <div style={{ fontSize: '0.9rem', fontWeight: 500, marginBottom: '0.25rem', color: active ? '#fff' : '#ccc' }}>{theme.name}</div>
                      <div style={{ fontSize: '0.75rem', color: '#555', lineHeight: 1.5 }}>{theme.desc}</div>
                    </div>
                    {active && <span style={{ color: '#fff', fontSize: '0.8rem', marginLeft: '0.5rem', flexShrink: 0 }}>✓</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );

      const TOTAL_STEPS = 4;
      const stepLabels = ['Brand Basics', 'Colours', 'Typography', 'Aesthetic'];

      return (
        <div style={{ minHeight: '100vh', padding: '4rem 2rem' }}>
          <div style={{ maxWidth: '800px', margin: '0 auto' }}>

            {/* Header */}
            <div style={{ marginBottom: '4rem', textAlign: 'center' }}>
              <a href="https://stackwell.digital" style={{ display: 'inline-block', marginBottom: '2rem' }}>
                <img src="https://raw.githubusercontent.com/StackwellDigital/StackwellDigital/main/logo.photo.png" alt="Stackwell Digital" style={{ height: '56px' }} />
              </a>
              <h1 style={{ fontFamily: 'Bebas Neue', fontSize: '3.5rem', marginBottom: '0.75rem', letterSpacing: '0.02em' }}>Brand Intake</h1>
              <p style={{ color: '#555', fontSize: '0.95rem', lineHeight: 1.7 }}>Help us understand your brand so we can build something that feels exactly right.</p>
            </div>

            {/* Progress */}
            <div style={{ display: 'flex', gap: '0.4rem', marginBottom: '3.5rem', justifyContent: 'center', alignItems: 'center' }}>
              {Array.from({ length: TOTAL_STEPS }, (_, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                  <div style={{ width: '28px', height: '28px', borderRadius: '50%', background: i + 1 < step ? '#fff' : i + 1 === step ? 'rgba(255,255,255,0.1)' : 'transparent', border: i + 1 <= step ? '1px solid #fff' : '1px solid rgba(255,255,255,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'DM Mono', fontSize: '0.6rem', color: i + 1 < step ? '#000' : i + 1 === step ? '#fff' : '#444', transition: 'all 0.3s' }}>
                    {i + 1 < step ? '✓' : i + 1}
                  </div>
                  {i < TOTAL_STEPS - 1 && <div style={{ width: '40px', height: '1px', background: i + 1 < step ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.1)' }} />}
                </div>
              ))}
            </div>

            {/* Step label */}
            <div style={{ fontFamily: 'DM Mono', fontSize: '0.62rem', letterSpacing: '0.25em', textTransform: 'uppercase', color: '#444', marginBottom: '2rem' }}>
              Step {step} of {TOTAL_STEPS} · {stepLabels[step - 1]}
            </div>

            {/* Content */}
            <div style={{ marginBottom: '3rem' }}>
              {step === 1 && renderStep1()}
              {step === 2 && renderStep2()}
              {step === 3 && renderStep3()}
              {step === 4 && renderStep4()}
            </div>

            {/* Error */}
            {submitError && (
              <div style={{ background: 'rgba(184,50,50,0.15)', border: '1px solid rgba(184,50,50,0.4)', color: '#e88', padding: '1rem 1.25rem', fontFamily: 'DM Mono', fontSize: '0.75rem', marginBottom: '1.5rem', lineHeight: 1.6 }}>
                {submitError}
              </div>
            )}

            {/* Navigation */}
            <div style={{ display: 'flex', gap: '1rem', justifyContent: step === 1 ? 'flex-end' : 'space-between' }}>
              {step > 1 && <button onClick={() => setStep(step - 1)} style={btnGhostStyle}>← Back</button>}
              {step < TOTAL_STEPS ? (
                <button onClick={() => setStep(step + 1)} style={btnPrimaryStyle}>Next →</button>
              ) : (
                <button
                  onClick={handleSubmit}
                  disabled={submitting}
                  style={{ ...btnPrimaryStyle, opacity: submitting ? 0.6 : 1, cursor: submitting ? 'not-allowed' : 'pointer' }}
                >
                  {submitting ? 'Sending...' : 'Submit →'}
                </button>
              )}
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.render(<BrandIntakeForm />, document.getElementById('root'));
  </script>
</body>
</html>
